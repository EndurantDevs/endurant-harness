name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-preflight:
    name: Local preflight (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install repository-search dependency
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Run the same staged preflight used locally
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -S endurant-harness/scripts/endurant.py run
          lab/local-ci-plan.json --repo . --format text
